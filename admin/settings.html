<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        body { background-color: var(--bg-light); }
        .launcher-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; display: none; }
        .launcher-container.active { display: block; }
        .launcher-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 50px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .header-brand img { width: 50px; height: 50px; object-fit: contain; }
        .header-brand h1 { margin: 0; font-family: 'Playfair Display', serif; color: var(--deep-brown); font-size: 1.5rem; }
        .header-actions { display: flex; gap: 15px; }
        .btn-nav { padding: 10px 20px; border: 1px solid var(--border); background: white; border-radius: 8px; color: var(--text-dark); text-decoration: none; font-weight: 500; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn-nav:hover { background: var(--bg-light); border-color: var(--gray-300); }
        
        .settings-card { background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; }
        .settings-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.3rem; color: var(--deep-brown); display: flex; align-items: center; gap: 10px; }
        .settings-card h2 i { color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-dark); }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Poppins', sans-serif; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        
        .slab-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: center; margin-bottom: 15px; padding: 15px; background: var(--bg-light); border-radius: 8px; border: 1px solid var(--border); }
        .slab-row input { margin-bottom: 0; }
        .btn-remove-slab { background: #FC8181; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        .btn-remove-slab:hover { background: #E53E3E; }
        
        .settings-actions { display: flex; gap: 15px; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; transition: background 0.3s; }
        .btn-save:hover { background: var(--primary-hover); }
        .btn-reset { background: white; color: var(--text-dark); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 500; font-family: 'Poppins', sans-serif; transition: all 0.3s; }
        .btn-reset:hover { background: var(--bg-light); }
    </style>
</head>
<body>

<div class="launcher-container" id="adminContent">
    <div class="launcher-header">
        <div class="header-brand">
            <img src="../logo.png" alt="Padmaja Home Foods">
            <h1>Settings &amp; Config</h1>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> Dashboard</a>
            <button class="btn-nav" onclick="handleAdminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    
    <!-- TABS -->
    <div class="admin-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0;">
        <button class="admin-tab active" onclick="switchSettingsTab('delivery')" id="tabBtn-delivery" style="padding: 10px 20px; border: none; background: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; color: var(--primary); border-bottom: 3px solid var(--primary); cursor: pointer;">
            <i class="fas fa-truck"></i> Delivery Settings
        </button>
        <button class="admin-tab" onclick="switchSettingsTab('coupons')" id="tabBtn-coupons" style="padding: 10px 20px; border: none; background: none; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 1rem; color: var(--text-gray); cursor: pointer;">
            <i class="fas fa-tags"></i> Discounts &amp; Coupons
        </button>
    </div>
    
    <!-- TAB CONTENT: DELIVERY -->
    <div class="settings-card" id="tabContent-delivery">
        <h2><i class="fas fa-truck"></i> Shipping Settings</h2>
        
        <div class="form-group" style="max-width: 300px;">
            <label>Free Delivery Threshold (₹)</label>
            <input type="number" id="freeDeliveryThreshold" min="0" placeholder="e.g. 1999">
        </div>
        
        <div style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <label style="font-weight: 500; color: var(--text-dark); margin: 0;">Weight Slabs</label>
                <button type="button" class="btn-nav" onclick="addWeightSlab()" style="padding: 6px 12px; font-size: 0.9rem;"><i class="fas fa-plus"></i> Add Slab</button>
            </div>
            
            <div id="weightSlabsContainer">
                <!-- Slabs rendered by JS -->
            </div>
        </div>
        
        <div class="settings-actions">
            <button type="button" class="btn-save" onclick="saveShippingSettings()" id="saveSettingsBtn">Save Settings</button>
            <button type="button" class="btn-reset" onclick="resetShippingSettings()">Reset to Default</button>
        </div>
    </div>

    <!-- TAB CONTENT: COUPONS -->
    <div class="settings-card" id="tabContent-coupons" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fas fa-tags"></i> Coupon Management</h2>
            <button type="button" class="btn-save" onclick="openCouponModal()">
                <i class="fas fa-plus"></i> Create New Coupon
            </button>
        </div>
        
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; margin-top: 10px;" id="couponsTable">
                <thead>
                    <tr style="background: var(--bg-light); text-align: left; border-bottom: 2px solid var(--border);">
                        <th style="padding: 12px; font-weight: 600;">Code</th>
                        <th style="padding: 12px; font-weight: 600;">Discount</th>
                        <th style="padding: 12px; font-weight: 600;">Status</th>
                        <th style="padding: 12px; font-weight: 600;">Usage</th>
                        <th style="padding: 12px; font-weight: 600;">Expires</th>
                        <th style="padding: 12px; font-weight: 600;">Actions</th>
                    </tr>
                </thead>
                <tbody id="couponsTableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 20px; color: var(--text-gray);">Loading coupons...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- COUPON MODAL -->
<style>
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .modal-header h3 { margin: 0; font-size: 1.3rem; color: var(--deep-brown); }
    .btn-close-modal { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-gray); }
    .btn-close-modal:hover { color: var(--spice-red); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
</style>

<div class="modal-overlay" id="couponModalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="couponModalTitle">Create Coupon</h3>
            <button class="btn-close-modal" onclick="closeCouponModal()"><i class="fas fa-times"></i></button>
        </div>
        <form id="couponForm" onsubmit="handleSaveCoupon(event)">
            <input type="hidden" id="couponId">
            
            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Coupon Code *</label>
                    <input type="text" id="couponCode" required placeholder="e.g. SUMMER20" style="text-transform: uppercase;" onkeyup="this.value = this.value.toUpperCase();">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Status</label>
                    <select id="couponIsActive" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="true">Active</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Discount Type *</label>
                    <select id="couponDiscountType" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="percentage">Percentage (%)</option>
                        <option value="fixed">Fixed Amount (₹)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Discount Value *</label>
                    <input type="number" id="couponDiscountValue" required min="0" step="0.01" placeholder="e.g. 10 or 150">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Minimum Order Value (₹)</label>
                    <input type="number" id="couponMinOrder" min="0" value="0">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Max Discount Amount (₹)</label>
                    <input type="number" id="couponMaxDiscount" min="0" placeholder="Optional (for % discounts)">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Usage Limit (Global)</label>
                    <input type="number" id="couponUsageLimit" min="1" placeholder="e.g. 100 (Optional)">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Usage per Customer</label>
                    <select id="couponUsagePerCustomer" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="unlimited">Unlimited (per customer)</option>
                        <option value="once">Once per customer</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Customer Eligibility</label>
                    <select id="couponCustomerEligibility" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="all">All Customers</option>
                        <option value="first_order">First-time Order Only</option>
                        <option value="existing">Existing Customers Only</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Expiry Date</label>
                    <input type="datetime-local" id="couponExpiryDate">
                </div>
            </div>

            <div class="settings-actions" style="justify-content: flex-end;">
                <button type="button" class="btn-reset" onclick="closeCouponModal()">Cancel</button>
                <button type="submit" class="btn-save" id="saveCouponBtn">Save Coupon</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast Notification -->
<style>
.admin-toast-container { position: fixed; top: 40px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.admin-toast { pointer-events: auto; background: #333; color: white; padding: 14px 20px; border-radius: 8px; font-weight: 500; font-size: 0.9rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); display: flex; align-items: center; gap: 10px; animation: toastSlide 0.3s ease; max-width: calc(100vw - 40px); word-break: break-word; margin-left: auto; }
.admin-toast.success { background: #28a745; }
.admin-toast.error { background: #dc3545; }
@keyframes toastSlide { from { transform: translateX(calc(100% + 20px)); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
<div class="admin-toast-container" id="adminToastContainer"></div>

<!-- App Scripts -->
<script src="../config.js"></script>
<script src="../db.js"></script>
<script src="../auth.js"></script>
<script src="admin.js"></script>
<script src="settings.js"></script>
</body>
</html>
